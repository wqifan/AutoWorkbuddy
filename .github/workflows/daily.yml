name: Buddy 加油站 · 每日签到 + 派猫猫

# 每天跑一次，一次运行里把「签到」和「派猫猫」都做完。
#
# cron 用 UTC：23:17 UTC = 次日 07:17（北京时间），避开 0 点刷新的抖动。
#
# 【实测记录，别急着「优化」掉】GitHub 的 schedule 是「尽力而为」，本仓库实测结果：
#   · 2026-10-26 23:17Z 四个点 → 0 次投递
#   · 2026-10-27 单独建 */5 探针连盯 50 分钟 → 0 次投递
#   · 2026-10-27 23:17Z 四个点 → 0 次投递（两次共 8 次请求，全部落空）
# 仓库属性全部正常（default_branch=main、fork=false、archived=false、
# Actions enabled=all、state=active、cron 语法有效），所以不是配置问题，
# 是 GitHub 调度侧对低活跃个人私有仓库的降级投递。
#
# 对策：4 个点**分散到 4 个不同小时**（北京 07:17 / 08:17 / 09:17 / 10:17）。
# 原先挤在 30 分钟内（23:17~23:47），一旦整小时被丢弃就全丢；
# 分散后是按小时独立掷骰子，只要有一天被投递就够。脚本本身是幂等的：
#   · 签到：服务端 today_checked_in / code=10001 兜住，不会重复领
#   · 派猫：服务端状态是 traveling 就跳过；已经回来过的，用「上一趟出发时间是否在今天」判断
#   · 推送：只有「真的做了事」的那一轮才发，一天最多一封
# 另需外部定时器兜底（见 README「定时不触发」一节）。
on:
  schedule:
    - cron: "17 23,0,1,2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: true
        default: run
        type: choice
        options:
          - run
          - dry-run # 只读：只查状态，不发任何写请求
      push:
        description: "飞书推送策略"
        required: false
        default: auto
        type: choice
        options:
          - auto   # 只有真的做了事才推
          - always # 每轮都推（手动验证时用）

permissions:
  contents: read

# 同一时间只允许一个实例，避免手动触发与定时任务撞车导致重复领取
concurrency:
  group: buddy-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 解释器路径一律现查，不写死 3.x 之类的版本号。
      # 产物路径走 runner 内置环境变量 RUNNER_TEMP：它本身就是 shell 里可用的变量，
      # 不需要任何表达式；而 runner 这个 expression context 只在 step 级可用
      # （写在 job 级 env 里会被 GitHub 判为 Invalid workflow file）。
      - name: 解析 Python 解释器与产物路径
        run: |
          PY="$(command -v python3)"
          if [ -z "$PY" ]; then
            echo "::error::找不到 python3"
            exit 1
          fi
          # 用 printf 而非 echo：echo 在部分实现下会解释路径里的反斜杠
          {
            printf 'PY=%s\n' "$PY"
            printf 'WB_RESULT_FILE=%s/buddy-summary.md\n' "$RUNNER_TEMP"
            printf 'WB_RAW_FILE=%s/buddy-raw.json\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
          "$PY" -V
          "$PY" -c "import sys; print('解释器就绪:', sys.executable)"
          echo "产物目录: $RUNNER_TEMP"

      - name: 签到 + 派猫猫 + 推送
        env:
          WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
          # QQ 邮箱推送：USER 与 AUTH_CODE 都填了才启用，只填一个等于没配
          QQ_MAIL_USER: ${{ secrets.QQ_MAIL_USER }}
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          QQ_MAIL_TO: ${{ secrets.QQ_MAIL_TO }}
          # 飞书也保留，两个都配就两边都收到
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          # 可选：飞书机器人开了「签名校验」才需要；未配置时为空字符串，不影响推送
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # 定时触发时 inputs.push 为空 → 脚本按 auto 处理
          WB_PUSH: ${{ inputs.push }}
        run: |
          set -o pipefail
          if [ -z "${WB_ACCESS_TOKEN:-}" ]; then
            echo "::error::缺少 Secret WB_ACCESS_TOKEN，请在本机运行 refresh_token.py 注入"
            exit 2
          fi
          MODE="${{ inputs.mode }}"
          if [ "$MODE" = "dry-run" ]; then
            echo "· 只读模式：不发写请求"
            exec "$PY" wb_auto.py --probe
          fi
          exec "$PY" wb_auto.py

      - name: 写入运行摘要
        if: always()
        run: |
          if [ -f "$WB_RESULT_FILE" ]; then
            cat "$WB_RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 项目 | 结论 |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 整体 | ❌ 脚本未产出结果（见上方日志） |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 留存脱敏后的原始返回
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buddy-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/buddy-raw.json
          if-no-files-found: warn
          retention-days: 7
